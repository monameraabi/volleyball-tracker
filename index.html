<!DOCTYPE html>
<html>
<head>
  <title>Volleyball Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 15px; }
    input, select, button { font-size: 16px; padding: 8px; margin: 4px 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>🏐 Volleyball Tracker</h1>

  <!-- shown when logged out -->
  <div id="auth-box">
    <h2>Log in or sign up</h2>
    <input id="email" type="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password (6+ characters)"><br>
    <button onclick="signUp()">Sign up</button>
    <button onclick="logIn()">Log in</button>
    <p id="msg"></p>
  </div>

  <!-- shown when logged in -->
  <div id="app-box" style="display:none">
    <p>Logged in as <b id="who"></b> <button onclick="logOut()">Log out</button></p>

    <input id="player" placeholder="Player name">
    <select id="type">
      <option value="kill">Kill</option>
      <option value="ace">Ace</option>
      <option value="block">Block</option>
      <option value="dig">Dig</option>
      <option value="error">Error</option>
    </select>
    <button onclick="addStat()">Add</button>

    <table>
      <thead>
        <tr>
          <th>Player</th><th>Kills</th><th>Aces</th>
          <th>Blocks</th><th>Digs</th><th>Errors</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <script>
    const db = supabase.createClient(
      "https://rjcghbikjpmdslzubvnx.supabase.co",
      "sb_publishable_aghLGh05CylAzcrxpiCD4w_ZRVg3N_z"
    );

    const TYPES = ["kill", "ace", "block", "dig", "error"];

    // ---------- login stuff ----------
    async function signUp() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await db.auth.signUp({ email, password });
      document.getElementById("msg").textContent = error
        ? error.message
        : "Account created! If you're not logged in automatically, press Log in.";
    }

    async function logIn() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) document.getElementById("msg").textContent = error.message;
    }

    async function logOut() {
      await db.auth.signOut();
    }

    // runs on page load AND every time someone logs in or out
    db.auth.onAuthStateChange((event, session) => {
      const loggedIn = !!session;
      document.getElementById("auth-box").style.display = loggedIn ? "none" : "block";
      document.getElementById("app-box").style.display = loggedIn ? "block" : "none";
      if (loggedIn) {
        document.getElementById("who").textContent = session.user.email;
        setTimeout(loadStats, 0);
      } else {
        document.getElementById("body").innerHTML = "";
      }
    });

    // ---------- stats stuff (same as before) ----------
    async function loadStats() {
      const { data, error } = await db.from("stats").select("player, type");
      if (error) { console.error(error); return; }

      const totals = {};
      for (const row of data) {
        if (!totals[row.player]) {
          totals[row.player] = { kill: 0, ace: 0, block: 0, dig: 0, error: 0 };
        }
        totals[row.player][row.type]++;
      }

      const body = document.getElementById("body");
      body.innerHTML = "";
      for (const name in totals) {
        const tr = document.createElement("tr");
        const nameCell = document.createElement("td");
        nameCell.textContent = name;
        tr.appendChild(nameCell);
        for (const t of TYPES) {
          const cell = document.createElement("td");
          cell.textContent = totals[name][t];
          tr.appendChild(cell);
        }
        body.appendChild(tr);
      }
    }

    async function addStat() {
      const player = document.getElementById("player").value.trim();
      const type = document.getElementById("type").value;
      if (!player) { alert("Type a player name first"); return; }

      const { error } = await db.from("stats").insert({ player, type });
      if (error) { console.error(error); alert("Something went wrong"); return; }
      loadStats();
    }
  </script>
</body>
</html>
